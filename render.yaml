services:
  - type: web
    name: queensway-early-years
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app app db upgrade
    startCommand: gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SCHOOL_EMAIL
        sync: false
      - key: SCHOOL_PHONE
        sync: false
      - key: SCHOOL_ADDRESS
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.11
